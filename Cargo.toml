[package]
name = "library_management_system_two"
version = "0.1.0"
edition = "2024"

[dependencies]
#Actix
actix-web = "4.15.0"
actix-cors = "0.7.2"
actix-multipart = "0.8.4"
actix-web-httpauth = "0.8.3"

#Serde
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"]}

#Json web token
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }

#Postgres sql
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }

#Solana anchor
solana-sdk = "3.0"
solana-client = "3.0"
anchor-client = { version = "1.2.0", features = ["async"] }

#Encryption
base64 = "0.23.1"
bcrypt = "0.19.3"

#asynchronous check
futures-util = "0.3.34"

#for microservice
reqwest = { version = "0.13.0", features = ["json", "multipart"] }

#for multithreading
tokio = { version = "1.53.1", features = ["full"] }

#for converting raw u8 to the particular struct
borsh = "1.8.1"

#For generating UUID
uuid = { version = "1.26.1", features = ["v4", "fast-rng", "serde"]}
